
services:

  db:
    image: postgres:17
    restart: unless-stopped

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro,Z

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      CURRICULUM_UPLOAD_DIR: /app/uploads
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:?Set DEMO_STUDENT_PASSWORD in .env}
      DEMO_INSTRUCTOR_PASSWORD: ${DEMO_INSTRUCTOR_PASSWORD:?Set DEMO_INSTRUCTOR_PASSWORD in .env}

    volumes:
      - ./backend:/app:Z
      - curriculum_uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - ./frontend:/app:Z
      - /app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data:
  curriculum_uploads:
