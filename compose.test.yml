# Standalone test stack: no database or network dependencies.
# Does not start the normal backend/frontend/PostgreSQL services.
services:
  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: not-used-by-tests
      JWT_SECRET_KEY: automated-test-only-secret-not-for-deployment
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    command: ["python", "-m", "pytest", "-v", "tests"]
